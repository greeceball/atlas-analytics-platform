name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build source data
        run: |
          python ingestion/ingest_customers.py
          python ingestion/ingest_orders.py
          python ingestion/load_warehouse.py

      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          atlas_analytics:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: "${{ github.workspace }}/data/warehouse/atlas.duckdb"
                threads: 1
          EOF

      - name: Run dbt build
        working-directory: dbt/atlas_analytics
        run: |
          dbt build